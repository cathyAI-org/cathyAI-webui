version: '3.8'
services:
  chainlit_db:
    image: postgres:16
    container_name: cathyai_chainlit_db
    environment:
      POSTGRES_DB: chainlit
      POSTGRES_USER: chainlit
      POSTGRES_PASSWORD: ${CHAINLIT_DB_PASSWORD}
    volumes:
      - ./state/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit"]
      interval: 10s
      timeout: 5s
      retries: 5

  webbui_chat:
    container_name: cathyai_webbui_chat
    depends_on:
      chainlit_db:
        condition: service_healthy
    build: .
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ../characters:/app/characters
      - ./public:/app/public
      - ./state:/state
    environment:
      PYTHONPATH: /app
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  webbui_auth_api:
    container_name: cathyai_webbui_auth_api
    build: .
    working_dir: /app
    command: ["python", "auth_api.py"]
    ports:
      - "8001:8001"
    volumes:
      - ./state:/state
    environment:
      PYTHONPATH: /app
      USER_DB_PATH: /state/users.sqlite
      USER_ADMIN_API_KEY: ${USER_ADMIN_API_KEY}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    env_file:
      - .env
    restart: unless-stopped

  wakeup_helper:
    image: python:3.12-alpine
    container_name: cathyai_wakeup_helper
    working_dir: /app
    command: ["python", "wakeup.py"]
    volumes:
      - ./wakeup/wakeup.py:/app/wakeup.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  wakeup_proxy:
    image: caddy:2
    container_name: cathyai_wakeup_proxy
    ports:
      - "7999:80"
    volumes:
      - ./wakeup/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped